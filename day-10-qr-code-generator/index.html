<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Kod Oluşturucu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">QR Kod Oluşturucu</h1>
    <p class="text-slate-500 text-sm mt-1">Metin veya URL'den anında QR kod oluşturun.</p>
  </header>

  <main class="flex-1 w-full max-w-xl mx-auto flex flex-col items-center gap-6">

    <!-- Giriş -->
    <div class="w-full flex flex-col gap-3">
      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">İçerik (metin veya URL)</label>
      <textarea id="qr-input" rows="3" placeholder="https://example.com veya herhangi bir metin..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm resize-none"></textarea>
    </div>

    <!-- Ayarlar -->
    <div class="grid grid-cols-2 gap-3 w-full">
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Boyut</label>
        <select id="qr-size" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm">
          <option value="200">200×200 px</option>
          <option value="300" selected>300×300 px</option>
          <option value="400">400×400 px</option>
          <option value="500">500×500 px</option>
        </select>
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Renk</label>
        <input type="color" id="qr-color" value="#000000" class="w-full h-10 rounded-lg border border-slate-200 bg-transparent cursor-pointer" />
      </div>
    </div>

    <!-- Oluştur butonu -->
    <button id="btn-generate" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform">QR Kod Oluştur</button>

    <!-- Önizleme -->
    <div class="flex-1 flex flex-col items-center justify-center min-h-[300px]">
      <div id="qr-preview" class="hidden p-4 rounded-2xl bg-white border border-slate-200 shadow-xl flex flex-col items-center gap-3">
        <img id="qr-image" class="rounded-lg shadow-md" alt="QR Kod" />
        <div class="flex items-center gap-2 text-xs text-slate-500">
          <span id="qr-info">300×300 px</span>
        </div>
      </div>
    </div>

    <!-- İndirme butonu -->
    <button id="btn-download" class="hidden w-full py-3 rounded-xl bg-emerald-600 text-white font-bold shadow-lg hover:bg-emerald-700 active:scale-95 transition-transform flex items-center justify-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      PNG Olarak İndir
    </button>

    <div class="mt-auto pt-4 border-t border-slate-100 text-[10px] text-slate-400 text-center">
      Day 10 · QR Kod Oluşturucu · QRCode.js · Tarayıcıda çalışır
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
