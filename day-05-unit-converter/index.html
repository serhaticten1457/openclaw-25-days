<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birim Dönüştürücü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Birim Dönüştürücü</h1>
    <p class="text-slate-500 text-sm mt-1">Uzunluk, ağırlık ve sıcaklık birimlerini anında dönüştürün.</p>
  </header>

  <main class="flex-1 w-full max-w-xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col gap-6">

    <!-- Kategori seçici -->
    <div class="flex justify-center gap-2">
      <button class="cat-btn active px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-sm" data-category="length">Uzunluk</button>
      <button class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50" data-category="weight">Ağırlık</button>
      <button class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50" data-category="temperature">Sıcaklık</button>
    </div>

    <!-- Dönüştürme formu -->
    <div class="flex-1 flex flex-col gap-4">

      <!-- Değer girişi -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Değer</label>
        <div class="relative">
          <input type="number" id="input-value" step="any" placeholder="0" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-lg font-mono" />
          <button id="btn-swap" class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-indigo-600 rounded hover:bg-slate-100 transition-colors" title="Birimleri değiştir">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
          </button>
        </div>
      </div>

      <!-- Birim seçiciler -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Dönüştür</label>
          <select id="from-unit" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm"></select>
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">İnce</label>
          <select id="to-unit" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm"></select>
        </div>
      </div>

      <!-- Sonuç -->
      <div class="mt-2 pt-4 border-t border-slate-100">
        <div class="flex items-baseline gap-2">
          <span id="result-value" class="text-3xl font-bold text-indigo-700 font-mono">0</span>
          <span id="result-unit" class="text-lg font-semibold text-slate-600">m</span>
        </div>
        <p id="result-text" class="text-xs text-slate-400 mt-1"></p>
      </div>

      <!-- Hızlı referans -->
      <div class="mt-auto pt-4 border-t border-slate-100">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Hızlı Referans</h3>
        <div id="quick-ref" class="space-y-1 text-xs text-slate-500">
          <!-- JS ile doldurulacak -->
        </div>
      </div>

    </div>

  </main>

  <footer class="mt-8 text-center text-[10px] text-slate-400">
    Day 5 · Birim Dönüştürücü · Tarayıcıda çalışır, kurulum gerektirmez
  </footer>

  <script src="script.js"></script>
</body>
</html>
