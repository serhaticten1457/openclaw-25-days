<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geri Sayım Zamanlayıcısı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-400 tracking-tight">Geri Sayım</h1>
    <p class="text-slate-400 text-sm mt-1">Önemli bir tarihe doğru geri sayım yapın.</p>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto flex flex-col items-center justify-center gap-8">

    <!-- Tarih seçici -->
    <div class="flex flex-col gap-3 w-full">
      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Hedef Tarih ve Saat</label>
      <input type="datetime-local" id="target-datetime" class="w-full px-4 py-3 rounded-xl border border-slate-700 bg-slate-800 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm" />
    </div>

    <!-- Kontrol -->
    <div class="flex gap-3 w-full">
      <button id="btn-start" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-bold shadow-lg hover:bg-indigo-500 active:scale-95 transition-transform">Başlat</button>
      <button id="btn-reset" class="px-6 py-3 rounded-xl bg-slate-800 text-slate-300 font-bold border border-slate-700 hover:bg-slate-700 active:scale-95 transition-transform">Sıfırla</button>
    </div>

    <!-- Zamanlayıcı -->
    <div class="relative w-full">
      <div class="absolute inset-0 flex items-center justify-center">
        <svg class="w-40 h-40" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="85" class="stroke-slate-800 stroke-16 fill-none" />
          <circle id="progress-ring" cx="100" cy="100" r="85" class="stroke-indigo-400 stroke-16 fill-none stroke-linecap round transition-none" style="stroke-dasharray: 534.07; stroke-dashoffset: 534.07;" transform="rotate(-90 100 100)" />
        </svg>
      </div>

      <div class="relative z-10 flex flex-col items-center justify-center h-40 w-40">
        <div class="text-6xl font-extrabold text-slate-100 leading-none font-mono" id="display">00:00:00:00</div>
        <div class="flex gap-1 text-xs font-semibold text-slate-500 uppercase tracking-tighter mt-2">
          <span id="label-d">G</span><span id="label-h">S</span><span id="label-m">D</span><span id="label-s">S</span>
        </div>
      </div>
    </div>

    <!-- Gün / Saat / Dakika / Saniye detay -->
    <div class="grid grid-cols-4 gap-2 w-full mb-2">
      <div class="text-center p-3 rounded-xl bg-slate-800/50 border border-slate-800">
        <div class="text-2xl font-bold font-mono text-indigo-400" id="val-d">00</div>
        <div class="text-[10px] text-slate-500 uppercase">Gün</div>
      </div>
      <div class="text-center p-3 rounded-xl bg-slate-800/50 border border-slate-800">
        <div class="text-2xl font-bold font-mono text-indigo-400" id="val-h">00</div>
        <div class="text-[10px] text-slate-500 uppercase">Saat</div>
      </div>
      <div class="text-center p-3 rounded-xl bg-slate-800/50 border border-slate-800">
        <div class="text-2xl font-bold font-mono text-indigo-400" id="val-m">00</div>
        <div class="text-[10px] text-slate-500 uppercase">Dakika</div>
      </div>
      <div class="text-center p-3 rounded-xl bg-slate-800/50 border border-slate-800">
        <div class="text-2xl font-bold font-mono text-indigo-400" id="val-s">00</div>
        <div class="text-[10px] text-slate-500 uppercase">Saniye</div>
      </div>
    </div>

    <div class="w-full" id="finish-message" class="hidden mt-4 p-4 rounded-xl bg-emerald-900 text-emerald-200 border border-emerald-700 text-center font-semibold">
      ✅ Hedef tarihe ulaşıldı!
    </div>

  </main>

  <footer class="mt-8 text-center text-[10px] text-slate-500">
    Day 13 · Geri Sayım Zamanlayıcısı · Tarayıcıda çalışır, kurulum gerektirmez
  </footer>

  <script src="script.js"></script>
</body>
</html>
