<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kronometre</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-400 tracking-tight">Kronometre</h1>
    <p class="text-slate-400 text-sm mt-1">Zamanlayıcı, tur kayıtları ve sıfırlama.</p>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto flex flex-col items-center justify-center">

    <!-- Zamanlayıcı ekranı -->
    <div class="relative w-full">
      <div class="absolute inset-0 flex items-center justify-center">
        <svg class="w-40 h-40" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="85" class="stroke-slate-800 stroke-16 fill-none" />
          <circle id="progress-ring" cx="100" cy="100" r="85" class="stroke-indigo-500 stroke-16 fill-none stroke-linecap round transition-none" style="stroke-dasharray: 534.07; stroke-dashoffset: 534.07;" transform="rotate(-90 100 100)" />
        </svg>
      </div>

      <div class="relative z-10 flex flex-col items-center justify-center h-40 w-40">
        <span id="display" class="text-6xl font-extrabold text-slate-100 leading-none font-mono">00:00.0</span>
        <span id="state-label" class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mt-1">Durduruldu</span>
      </div>
    </div>

    <!-- Kontrol butonları -->
    <div class="flex gap-3 w-full mb-8">
      <button id="btn-start" class="flex-1 py-4 rounded-2xl bg-indigo-600 text-white font-bold text-lg shadow-lg hover:bg-indigo-500 active:scale-95 transition-transform">Başlat</button>
      <button id="btn-lap" class="flex-1 py-4 rounded-2xl bg-slate-800 text-slate-300 font-bold text-lg border border-slate-700 hover:bg-slate-700 active:scale-95 transition-transform" disabled>Tur</button>
      <button id="btn-reset" class="flex-1 py-4 rounded-2xl bg-rose-600 text-white font-bold text-lg shadow-lg hover:bg-rose-500 active:scale-95 transition-transform">Sıfırla</button>
    </div>

    <!-- Tur kayıtları -->
    <div class="w-full flex-1">
      <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 pl-2">Tur Kayıtları</h3>
      <div id="lap-list" class="space-y-2 pr-2 max-h-64 overflow-y-auto">
        <!-- Tur satırları JS ile doldurulacak -->
        <div class="py-8 text-center text-slate-500 text-sm" id="empty-laps">Henüz tur kaydı yok.</div>
      </div>
    </div>

  </main>

  <footer class="mt-8 text-center text-[10px] text-slate-500">
    Day 11 · Kronometre · Tarayıcıda çalışır, kurulum gerektirmez
  </footer>

  <script src="script.js"></script>
</body>
</html>
