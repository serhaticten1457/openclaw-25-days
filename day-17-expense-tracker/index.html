<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gider Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-6 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Gider Takip</title>
    <p class="text-slate-500 text-sm mt-1">Giderlerinizi kaydedin, kategorilere ayırın, toplamı görüntüleyin.</p>
  </header>

  <main class="flex-1 w-full max-w-3xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Gider ekleme formu -->
    <section class="lg:col-span-4 bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col h-full">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Yeni Gider</h2>

      <div class="flex flex-col gap-3 mb-4">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tutar (₺)</label>
        <input type="number" id="expense-amount" step="0.01" min="0" placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm" />
      </div>

      <div class="flex flex-col gap-3 mb-4">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Kategori</label>
        <select id="expense-category" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm">
          <option value="yemek">Yemek</option>
          <option value="ulasim">Ulaşım</option>
          <option value="ev">Ev Faturaları</option>
          <option value="eglence">Eğlence</option>
          <option value="saglik">Sağlık</option>
          <option value="diger">Diğer</option>
        </select>
      </div>

      <div class="flex flex-col gap-3 mb-4 flex-1">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Açıklama</label>
        <input type="text" id="expense-desc" placeholder="Örn: Akşam yemeği" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm" />
      </div>

      <div class="flex flex-col gap-3 mb-4">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tarih</label>
        <input type="date" id="expense-date" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm" />
      </div>

      <button id="btn-add-expense" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform">Gider Ekle</button>

      <div class="mt-auto pt-6 border-t border-slate-100 text-[10px] text-slate-400 text-center">
        Day 17 · Gider Takip · localStorage ile kalıcı
      </div>
    </section>

    <!-- Gider listesi ve özet -->
    <section class="lg:col-span-8 bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col h-full">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-slate-800">Giderleriniz</h2>
        <button id="btn-clear-all" class="text-sm text-rose-500 hover:text-rose-700 font-medium">Tümünü Sil</button>
      </div>

      <!-- Özet kartları -->
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
          <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Toplam Gider</div>
          <div class="text-2xl font-bold font-mono text-slate-800" id="val-total">0.00 ₺</div>
        </div>
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
          <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Kayıt Sayısı</div>
          <div class="text-2xl font-bold font-mono text-slate-800" id="val-count">0</div>
        </div>
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
          <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Ortalama</div>
          <div class="text-2xl font-bold font-mono text-slate-800" id="val-avg">0.00 ₺</div>
        </div>
      </div>

      <!-- Liste -->
      <div id="expense-list" class="space-y-3 flex-1 overflow-y-auto pr-2">
        <!-- Satırlar JS ile doldurulacak -->
        <div class="py-8 text-center text-slate-400 text-sm" id="empty-state">Henüz gider eklenmemiş.</div>
      </div>

      <div class="mt-auto pt-6 border-t border-slate-100 text-[10px] text-slate-400 text-center">
        Tüm veriler tarayıcınızda yerel olarak saklanır.
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
