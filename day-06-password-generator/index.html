<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifre Üreteci</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Şifre Üreteci</h1>
    <p class="text-slate-500 text-sm mt-1">Güçlü ve rastgele şifreler oluşturun.</p>
  </header>

  <main class="flex-1 w-full max-w-xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col gap-6">

    <!-- Üretilen şifre -->
    <div class="flex flex-col items-center gap-3">
      <div class="relative w-full">
        <input type="text" id="password-display" readonly class="w-full px-4 py-4 rounded-xl border border-slate-200 bg-slate-50 text-lg font-mono font-bold text-indigo-700 text-center outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Şifre buraya gelecek" />
        <button id="btn-copy" class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-indigo-600 rounded hover:bg-slate-100 transition-colors" title="Panoya kopyala">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
        </button>
      </div>
      <span id="strength" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Şifre gücü: —</span>
    </div>

    <!-- Güç çubuğu -->
    <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
      <div id="strength-bar" class="h-full bg-indigo-200 rounded-full w-0 transition-all duration-300"></div>
    </div>

    <!-- Ayarlar -->
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Şifre Uzunluğu</label>
        <span id="length-val" class="text-sm font-mono font-bold text-indigo-600">12</span>
      </div>
      <input type="range" id="length-slider" min="6" max="64" value="12" class="w-full accent-indigo-500 h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer" />

      <div class="grid grid-cols-2 gap-3">
        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 transition-colors">
          <input type="checkbox" id="inc-lower" checked class="accent-indigo-600 rounded" />
          <span class="text-sm text-slate-700">Küçük harfler (a-z)</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 transition-colors">
          <input type="checkbox" id="inc-upper" checked class="accent-indigo-600 rounded" />
          <span class="text-sm text-slate-700">Büyük harfler (A-Z)</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 transition-colors">
          <input type="checkbox" id="inc-numbers" checked class="accent-indigo-600 rounded" />
          <span class="text-sm text-slate-700">Rakamlar (0-9)</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 transition-colors">
          <input type="checkbox" id="inc-symbols" class="accent-indigo-600 rounded" />
          <span class="text-sm text-slate-700">Semboller (!@#$...)</span>
        </label>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 transition-colors">
          <input type="checkbox" id="inc-ambiguous" class="accent-indigo-600 rounded" />
          <span class="text-sm text-slate-700">Karışık karakterler (iL10O0)</span>
        </label>
        <button id="btn-generate" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform">Yeni Şifre Oluştur</button>
      </div>

      <div class="mt-auto pt-4 border-t border-slate-100 text-[10px] text-slate-400 text-center">
        Day 6 · Şifre Üreteci · Yerel olarak üretilir, sunucuya gönderilmez
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
