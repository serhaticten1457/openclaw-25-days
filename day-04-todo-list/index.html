<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-indigo-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-8 text-center">
    <h1 class="text-4xl font-extrabold text-indigo-700 tracking-tight">Todo List</h1>
    <p class="text-slate-500 text-sm mt-1">Görevlerinizi düzenleyin, tamamlayın, silin.</p>
  </header>

  <main class="flex-1 w-full max-w-2xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Görev ekleme paneli -->
    <section class="lg:col-span-4 bg-white rounded-2xl shadow-xl border border-indigo-100 p-6 flex flex-col h-full">
      <div class="flex items-center gap-2 mb-6">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold">+</div>
        <span class="text-lg font-bold text-indigo-700">Yeni Görev</span>
      </div>

      <div class="flex flex-col gap-3">
        <label class="text-sm font-semibold text-slate-700">Görev Başlığı</label>
        <input type="text" id="todo-input" placeholder="Ne yapman gerekiyor?" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm" />
      </div>

      <div class="flex flex-col gap-3 mt-2">
        <label class="text-sm font-semibold text-slate-700">Öncelik</label>
        <div class="flex gap-2">
          <button class="priority-btn flex-1 py-2 rounded-xl border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50" data-priority="low">Düşük</button>
          <button class="priority-btn flex-1 py-2 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-700 font-medium" data-priority="medium">Orta</button>
          <button class="priority-btn flex-1 py-2 rounded-xl border border-rose-200 text-rose-600 font-medium hover:bg-rose-50" data-priority="high">Yüksek</button>
        </div>
      </div>

      <button id="btn-add" class="mt-6 w-full py-3 rounded-xl bg-indigo-600 text-white font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform">Görev Ekle</button>

      <div class="mt-auto pt-6 border-t border-indigo-50 text-xs text-slate-400 text-center">
        Day 4 · Todo List · localStorage ile kalıcı
      </div>
    </section>

    <!-- Görev listesi paneli -->
    <section class="lg:col-span-8 bg-white rounded-2xl shadow-xl border border-indigo-100 p-6 flex flex-col h-full">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-lg font-bold text-slate-800">Görevleriniz</h2>
          <p class="text-xs text-slate-500" id="stats">Toplam 0 · Tamamlanan 0</p>
        </div>
        <div class="flex gap-2">
          <button class="filter-btn active px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-600 text-white shadow-sm" data-filter="all">Hepsi</button>
          <button class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-50" data-filter="active">Aktif</button>
          <button class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-50" data-filter="completed">Tamamlanan</button>
        </div>
      </div>

      <ul id="todo-list" class="space-y-3 flex-1 overflow-y-auto pr-2">
        <!-- Görevler JS ile doldurulacak -->
      </ul>

      <div class="mt-auto pt-6 border-t border-indigo-50">
        <button id="btn-clear" class="text-sm text-rose-500 hover:text-rose-700 font-medium flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Tamamlanmışları Temizle
        </button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
