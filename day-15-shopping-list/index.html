<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alışveriş Listesi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Alışveriş Listesi</h1>
    <p class="text-slate-500 text-sm mt-1">Ürünleri ekleyin, alınanları işaretleyin.</p>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col gap-6">

    <!-- Yeni ürün ekleme -->
    <div class="flex flex-col gap-3">
      <div class="flex gap-2">
        <input type="text" id="item-input" placeholder="Ürün adı..." class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm" />
        <button id="btn-add" class="px-5 py-3 rounded-xl bg-indigo-600 text-white font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform">Ekle</button>
      </div>
      <div class="flex items-center gap-3 text-xs text-slate-500">
        <span id="stats">Toplam 0 · Alınan 0</span>
      </div>
    </div>

    <!-- Ürün listesi -->
    <div id="item-list" class="space-y-2 flex-1 overflow-y-auto pr-2">
      <!-- Ürünler JS ile doldurulacak -->
      <div class="py-8 text-center text-slate-400 text-sm" id="empty-state">
        Henüz ürün eklenmemiş.
      </div>
    </div>

    <!-- İşlem butonları -->
    <div class="mt-auto pt-6 border-t border-slate-100 flex gap-3">
      <button id="btn-clear-completed" class="flex-1 py-2 rounded-xl bg-rose-50 text-rose-600 font-semibold border border-rose-100 hover:bg-rose-100 active:scale-95 transition-transform">Alınanları Temizle</button>
      <button id="btn-clear-all" class="flex-1 py-2 rounded-xl bg-slate-100 text-slate-600 font-semibold border border-slate-200 hover:bg-slate-200 active:scale-95 transition-transform">Tümünü Sil</button>
    </div>

    <div class="mt-auto pt-4 border-t border-slate-100 text-[10px] text-slate-400 text-center">
      Day 15 · Alışveriş Listesi · localStorage ile kalıcı
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
