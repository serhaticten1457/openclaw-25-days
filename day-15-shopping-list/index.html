<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alışveriş Listesi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-6 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Alışveriş Listesi</h1>
    <p class="text-slate-500 text-sm mt-1">Günlük ihtiyaçlarınızı not alın, işaretleyin.</p>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col gap-6">

    <!-- Yeni ürün ekleme -->
    <div class="flex flex-col gap-3">
      <div class="relative">
        <input type="text" id="item-input" placeholder="Yeni ürün ekleyin..." class="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm" />
        <button id="btn-add" class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 active:scale-95 transition-transform">Ekle</button>
      </div>
      <p id="input-hint" class="text-[10px] text-slate-400">Enter tuşu ile ekleyebilirsiniz.</p>
    </div>

    <!-- Liste -->
    <div id="item-list" class="space-y-2 flex-1 overflow-y-auto pr-2">
      <!-- Öğeler JS ile doldurulacak -->
      <div class="py-8 text-center text-slate-400 text-sm" id="empty-state">Henüz ürün eklenmemiş.</div>
    </div>

    <!-- İstatistik -->
    <div class="mt-auto pt-6 border-t border-slate-100 flex justify-between items-center">
      <div class="text-sm text-slate-600">Toplam: <span id="total-count" class="font-bold">0</span></div>
      <div class="text-sm text-indigo-600 font-bold" id="done-count">0 tamamlandı</div>
    </div>

    <div class="mt-auto pt-4 border-t border-slate-100 text-[10px] text-slate-400 text-center">
      Day 15 · Alışveriş Listesi · localStorage ile kalıcı
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
