<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Zamanlayıcısı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col items-center justify-center p-4">

  <header class="mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Pomodoro</h1>
    <p class="text-slate-500 text-sm mt-1">Odağını koru, aralıklı dinlen.</p>
  </header>

  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 border border-slate-100">

    <!-- Mod seçici -->
    <div class="flex justify-center gap-2 mb-6">
      <button id="mode-work" class="mode-btn active px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-600 text-white shadow-sm">Çalışma</button>
      <button id="mode-short" class="mode-btn px-4 py-2 rounded-lg text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">Kısa Mola</button>
      <button id="mode-long" class="mode-btn px-4 py-2 rounded-lg text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">Uzun Mola</button>
    </div>

    <!-- Zamanlayıcı ekranı -->
    <div class="relative group">
      <div class="absolute inset-0 flex items-center justify-center">
        <svg class="w-32 h-32" viewBox="0 0 200 200">
          <circle
            cx="100" cy="100" r="80"
            class="stroke-slate-100 stroke-12 fill-none"
          />
          <circle
            id="progress-circle"
            cx="100" cy="100" r="80"
            class="stroke-indigo-600 stroke-12 fill-none stroke-linecap round transition-none"
            style="stroke-dasharray: 502.65; stroke-dashoffset: 502.65;"
            transform="rotate(-90 100 100)"
          />
        </svg>
      </div>

      <div class="relative z-10 flex flex-col items-center justify-center h-32 w-32">
        <span id="timer" class="text-6xl font-extrabold text-slate-900 leading-none">25:00</span>
        <span id="session-label" class="text-xs font-semibold text-indigo-600 uppercase tracking-wider mt-1">Çalışma Süresi</span>
      </div>
    </div>

    <!-- Kontrol butonları -->
    <div class="flex gap-3 mt-8">
      <button id="btn-start" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-bold text-lg shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform">Başlat</button>
      <button id="btn-reset" class="px-6 py-3 rounded-xl bg-white text-slate-600 font-bold text-lg border border-slate-200 hover:bg-slate-50 active:scale-95 transition-transform">Sıfırla</button>
    </div>

    <!-- Ayarlar -->
    <div class="mt-6 pt-6 border-t border-slate-100">
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Süreleri Ayarla (dakika)</h3>
      <div class="grid grid-cols-3 gap-2">
        <div class="flex items-center justify-between">
          <span class="text-sm text-slate-600">Çalışma</span>
          <input id="input-work" type="number" value="25" class="w-16 py-1 px-2 rounded border border-slate-200 text-sm text-center focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm text-slate-600">Kısa Mola</span>
          <input id="input-short" type="number" value="5" class="w-16 py-1 px-2 rounded border border-slate-200 text-sm text-center focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm text-slate-600">Uzun Mola</span>
          <input id="input-long" type="number" value="15" class="w-16 py-1 px-2 rounded border border-slate-200 text-sm text-center focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
      </div>
    </div>

  </main>

  <footer class="mt-8 text-center text-xs text-slate-400">
    Day 1 · Pomodoro Zamanlayıcısı · <span id="cycle-count">0 tamamlanan tur</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
