<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roma Rakamı Dönüştürücü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Roma Rakamı</h1>
    <p class="text-slate-500 text-sm mt-1">Arap rakamı ↔ Roma rakamı dönüşümü.</p>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col gap-6">

    <!-- Mod seçici -->
    <div class="flex justify-center gap-2 mb-2">
      <button class="mode-btn active px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-sm" data-mode="to-roman">Arap → Roma</button>
      <button class="mode-btn px-4 py-2 rounded-xl text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50" data-mode="to-arabic">Roma → Arap</button>
    </div>

    <!-- Giriş -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider" id="input-label">Sayıyı Girin</label>
      <input type="text" id="input-value" placeholder="Örn: 1999 veya MCMXCIX" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-lg font-mono text-center" />
    </div>

    <!-- Dönüştür butonu -->
    <button id="btn-convert" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform">Dönüştür</button>

    <!-- Sonuç -->
    <div id="result-card" class="hidden p-6 rounded-2xl bg-indigo-50 border border-indigo-100 flex flex-col items-center text-center">
      <span class="text-xs font-semibold text-indigo-600 uppercase tracking-wider">Sonuç</span>
      <div id="result-value" class="text-5xl font-extrabold font-mono text-indigo-700">MCMXCIX</div>
    </div>

    <!-- Bilgi -->
    <div class="mt-auto pt-6 border-t border-slate-100 text-[10px] text-slate-400 text-center">
      Day 21 · Roma Rakamı Dönüştürücü · 1–3999 aralığı · Tarayıcıda çalışır
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
