<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kripto Para Takibi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-6 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-400 tracking-tight">Kripto Takip</h1>
    <p class="text-slate-400 text-sm mt-1">Gerçek zamanlı coin fiyatları ve günlük değişim.</p>
  </header>

  <main class="flex-1 w-full max-w-3xl mx-auto flex flex-col gap-6">

    <!-- Kontrol -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <button id="btn-refresh" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold shadow-lg hover:bg-indigo-500 active:scale-95 transition-transform flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Yenile
        </button>
        <span class="text-xs text-slate-500" id="last-updated">Güncellenmedi</span>
      </div>

      <div class="relative w-full lg:w-64">
        <input type="text" id="search" placeholder="Coin ara (bitcoin, ethereum...)" class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-700 bg-slate-800 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm" />
        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
    </div>

    <!-- Coin listesi -->
    <div class="flex-1 overflow-y-auto pr-2">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-700">
            <th class="py-3 pl-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Coin</th>
            <th class="py-3 pr-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-right">Fiyat (USD)</th>
            <th class="py-3 pr-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-right">24s Değişim</th>
          </tr>
        </thead>
        <tbody id="coin-list" class="divide-y divide-slate-800">
          <!-- Satırlar JS ile doldurulacak -->
          <tr class="loading-row">
            <td colspan="3" class="py-8 text-center text-slate-500 text-sm">Yükleniyor...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-auto pt-6 border-t border-slate-800 text-[10px] text-slate-500 text-center">
      Day 9 · Kripto Para Takibi · CoinGecko API · Tarayıcıda çalışır
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
