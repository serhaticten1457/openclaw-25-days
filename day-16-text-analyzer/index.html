<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metin Analizi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-6 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Metin Analizi</h1>
    <p class="text-slate-500 text-sm mt-1">Karakter, kelime, cümle ve okuma süresi analizi.</p>
  </header>

  <main class="flex-1 w-full max-w-3xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- Giriş -->
    <section class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col h-full">
      <div class="flex justify-between items-center mb-4">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Girdi</span>
        <button id="btn-clear" class="text-xs font-semibold text-rose-500 hover:text-rose-700">Temizle</button>
      </div>
      <textarea id="input-text" rows="12" placeholder="Buraya metin yazın veya yapıştırın..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm resize-none font-mono"></textarea>
      <div class="mt-3 flex gap-2">
        <button id="btn-load-sample" class="flex-1 py-2 rounded-xl bg-slate-100 text-slate-600 text-sm font-medium hover:bg-slate-200 active:scale-95 transition-transform">Örnek Yükle</button>
        <button id="btn-copy" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform">Kopyala</button>
      </div>
    </section>

    <!-- Analiz sonuçları -->
    <section class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col h-full">
      <h2 class="text-lg font-bold text-slate-800 mb-6">Analiz Sonuçları</h2>

      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-center">
          <div class="text-[10px] font-semibold text-indigo-600 uppercase tracking-wider">Karakter</div>
          <div class="text-2xl font-bold font-mono text-slate-800" id="val-chars">0</div>
        </div>
        <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-center">
          <div class="text-[10px] font-semibold text-indigo-600 uppercase tracking-wider">Karakter (boşluk hariç)</div>
          <div class="text-2xl font-bold font-mono text-slate-800" id="val-chars-ns">0</div>
        </div>
        <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-center">
          <div class="text-[10px] font-semibold text-indigo-600 uppercase tracking-wider">Kelime</div>
          <div class="text-2xl font-bold font-mono text-slate-800" id="val-words">0</div>
        </div>
        <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-center">
          <div class="text-[10px] font-semibold text-indigo-600 uppercase tracking-wider">Cümle</div>
          <div class="text-2xl font-bold font-mono text-slate-800" id="val-sentences">0</div>
        </div>
        <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-center">
          <div class="text-[10px] font-semibold text-indigo-600 uppercase tracking-wider">Paragraf</div>
          <div class="text-2xl font-bold font-mono text-slate-800" id="val-paragraphs">0</div>
        </div>
        <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-center">
          <div class="text-[10px] font-semibold text-indigo-600 uppercase tracking-wider">Okuma Süresi</div>
          <div class="text-2xl font-bold font-mono text-slate-800" id="val-reading">0 dakika</div>
        </div>
      </div>

      <!-- En sık kullanılan kelimeler -->
      <div class="mt-auto pt-6 border-t border-slate-100 flex-1 overflow-y-auto pr-2">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">En Sık Kullanılan Kelimeler</h3>
        <div id="word-list" class="space-y-2">
          <!-- JS ile doldurulacak -->
          <div class="py-4 text-center text-slate-400 text-sm">Henüz metin girilmedi.</div>
        </div>
      </div>

      <div class="mt-auto pt-4 border-t border-slate-100 text-[10px] text-slate-400 text-center">
        Day 16 · Metin Analizi · Yerel olarak çalışır
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
