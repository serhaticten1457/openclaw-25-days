<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not Kayıt Uygulaması</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col p-4">

  <header class="mb-6 text-center">
    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Notlar</h1>
    <p class="text-slate-500 text-sm mt-1">Fikirlerinizi yazın, kaydedin, düzenleyin.</p>
  </header>

  <main class="flex-1 w-full max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Yeni not formu -->
    <section class="lg:col-span-4 bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col h-full">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Yeni Not</h2>

      <div class="flex flex-col gap-3 mb-4">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Başlık</label>
        <input type="text" id="note-title" placeholder="Başlık girin..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm" />
      </div>

      <div class="flex flex-col gap-3 flex-1">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">İçerik</label>
        <textarea id="note-content" rows="6" placeholder="Notunuzu buraya yazın..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm resize-none"></textarea>
      </div>

      <button id="btn-save" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform">Notu Kaydet</button>

      <div class="mt-auto pt-4 border-t border-slate-100 text-[10px] text-slate-400 text-center">
        Day 8 · Not Kayıt Uygulaması · localStorage ile kalıcı
      </div>
    </section>

    <!-- Not listesi -->
    <section class="lg:col-span-8 bg-white rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col h-full">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-slate-800">Tüm Notlar</h2>
        <div class="relative">
          <input type="text" id="search" placeholder="Ara..." class="pl-8 pr-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm w-48" />
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
      </div>

      <div id="note-list" class="space-y-3 flex-1 overflow-y-auto pr-2">
        <!-- Notlar JS ile doldurulacak -->
        <div class="py-8 text-center text-slate-400 text-sm" id="empty-state">
          Henüz not eklenmemiş. İlk notunuzu oluşturun!
        </div>
      </div>

      <div class="mt-auto pt-6 border-t border-slate-100">
        <button id="btn-clear-all" class="text-sm text-rose-500 hover:text-rose-700 font-medium flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Tümünü Sil
        </button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
